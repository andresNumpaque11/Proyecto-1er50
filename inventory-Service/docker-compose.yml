
services:
  mongo-inventory:
    image: mongo:8
    container_name: mongo-inventory
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "a123"
    volumes:
      - mongo_inventory_data:/data/db

volumes:
  mongo_inventory_data: