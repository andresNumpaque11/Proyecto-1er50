server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Los servicios (users-service, inventory-service) ya agregan sus propias
          # cabeceras CORS. Sin este filtro, la respuesta llega con
          # Access-Control-Allow-Origin duplicado y el navegador la rechaza
          # ("Failed to fetch"). Con RETAIN_FIRST se conserva solo la del gateway.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: ms-turnos
              uri: lb://MS-TURNOS
              predicates:
                - Path=/api/turnos/**, /api/disponibilidad/**

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/inventory/**

            - id: users-service
              uri: lb://USERS-SERVICE
              predicates:
                - Path=/api/auth/**, /api/users/**

            - id: delivery-service
              uri: lb://DELIVERY-SERVICE
              predicates:
                - Path=/api/v1/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}