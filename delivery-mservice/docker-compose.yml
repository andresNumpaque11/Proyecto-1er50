services:

  app:
    build:
      context: .
    container_name: delivery-mservice
    restart: unless-stopped
    env_file:
      - .env

    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0

    ports:
      - "8000:8000"

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s


  mongodb:
    image: mongo:8
    container_name: delivery-mservicedb
    restart: unless-stopped

    command:
      - mongod
      - --bind_ip_all
      - --replSet
      - rs0

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s


  mongo-init:
    image: mongo:8
    container_name: delivery_mongo_init

    depends_on:
      mongodb:
        condition: service_healthy

    restart: "no"

    command:
      - mongosh
      - --host
      - mongodb:27017
      - --eval
      - |
        try {
          rs.status();
          print("Replica set ya inicializado");
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [
              {
                _id: 0,
                host: "mongodb:27017"
              }
            ]
          });
          print("Replica set inicializado");
        }


volumes:
  mongodb_data: