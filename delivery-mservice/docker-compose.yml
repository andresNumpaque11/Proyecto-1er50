name: delivery

services:
  app:
    build:
      context: .
    container_name: delivery-mservice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://host.docker.internal:27018/?directConnection=true
      EUREKA_SERVER: http://host.docker.internal:8761/eureka/
      EUREKA_INSTANCE_HOST: localhost
      EUREKA_INSTANCE_PORT: "8002"
    ports:
      - "8002:8000"
