global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ms-turnos"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["ms-turnos:8081"]

  - job_name: "gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8761"]
